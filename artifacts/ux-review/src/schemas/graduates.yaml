# flat survey — all questions form one axis
questions:
  - تتلائم أهداف البرامج مع احتياجات سوق العمل
  - يلبي البرنامج التعليمي احتياجات المجتمع وسوق العمل
  - أكسبك البرنامج المعارف اللازمة لسوق العمل
  - هناك معلومات جديدة تقترح إضافتها
  - أكسبك البرنامج المهارات المهنية التخصصية اللازمة لسوق العمل
  - اكسبك البرنامج مهارات التوظف مثل القدرة علي العمل الجماعي وحل المشكلات وتقديم أفكار جديدة ومقترحات لتطوير العمل
  - هناك مهارات جديدة تقترح إكتسابها
  - تخصص البرنامج مطلوب في سوق العمل
  - الدراسة بالبرنامج جعلتك كخريج مؤهلاً للعمل الذي تشغله في حالة التوظف
  - أعمل في مجال تخصصي
  - يتيح البرنامج فرص عمل أفضل للخريج بعد الانتهاء من دراسته
