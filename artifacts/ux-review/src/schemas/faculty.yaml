axes:
  - name: "أولاً: مصداقية الإدارة"
    recommendation: تعزيز شفافية القرارات الصادرة عن المجالس واللجان بالإعلان الدوري عن نواتجها، وتفعيل آلية موثقة لمتابعة حل المشكلات في أطر زمنية محددة.
    questions:
      - تلتزم إدارة الكلية بتطبيق القرارات الصادرة عن المجالس واللجان
      - تلتزم إدارة الكلية بحل المشاكل

  - name: "ثانياً: نمط القيادة الأكاديمية"
    recommendation: تفعيل سياسة الباب المفتوح من خلال لقاءات دورية مع القيادة الأكاديمية، والتوسع في تفويض الصلاحيات لأعضاء هيئة التدريس بما يحقق المرونة في إنجاز المهام.
    questions:
      - تتميز قيادة الكلية بتطبيق سياسة الباب المفتوح واحترام الآراء
      - تقوم قيادة الكلية بتفويض السلطات والاختصاصات

  - name: "ثالثاً: العلاقات مع القيادات الأكاديمية"
    recommendation: تعزيز قيم التقدير والاحترام المتبادل بين القيادة الأكاديمية وأعضاء هيئة التدريس من خلال برامج تكريم المتميزين والاحتفاء بإنجازاتهم.
    questions:
      - تقدر قيادة الكلية الكفاءات من أعضاء هيئة التدريس
      - تحترم قيادة الكلية الأكاديمية عضو هيئة التدريس

  - name: "رابعاً: المشاركة في اتخاذ القرارات"
    recommendation: إشراك أعضاء هيئة التدريس في صنع واتخاذ القرارات المتعلقة بالعملية التعليمية، وتمكينهم من رفع المقترحات عبر قنوات معتمدة مع توضيح آلية الرد عليها.
    questions:
      - تسمح لك القيادة بالمشاركة في صنع واتخاذ القرارات

  - name: "خامساً: فاعلية مجالس الأقسام"
    recommendation: رفع فاعلية مجالس الأقسام بمتابعة تنفيذ قراراتها وقياس أثرها على تطوير الأداء، وإتاحة محاضر المجالس لأعضاء القسم.
    questions:
      - تساهم قرارات مجالس الأقسام بتطوير الأداء بالقسم

  - name: "سادساً: الأعباء التدريسية"
    recommendation: مراجعة آلية توزيع الأعباء التدريسية وفق معايير عادلة معلنة، وتحقيق التوازن بين الأعباء والمهام الموكلة بما يضمن جودة الأداء التدريسي.
    questions:
      - تراعي إدارة الكلية العدالة في تحديد العبء التدريسي
      - يتلائم العبء التدريسي مع المهام الموكلة إليكم

  - name: "سابعاً: الدعم المالي للبحث العلمي"
    recommendation: تخصيص بند مالي معتمد لدعم الأبحاث العلمية لأعضاء هيئة التدريس، وتحديث مراجع ودوريات المكتبة، وتوفير حوافز للمشاركة في المؤتمرات والندوات.
    questions:
      - تقدم الكلية دعم مالي للبحث العلمي
      - تتوافر بالمكتبة مراجع ودوريات علمية لدعم البحث العلمي
      - تحفز إدارة الكلية أعضاء هيئة التدريس للمشاركة في المؤتمرات والندوات العلمية

  - name: "ثامناً: إتاحة المعلومات"
    recommendation: تحديث موقع الكلية الإلكتروني وإصداراتها بشكل دوري لتوفير المعلومات اللازمة لأعضاء هيئة التدريس، مع إتاحة قنوات تواصل واضحة للاستفسارات.
    questions:
      - توفير كافة المعلومات التي تفيدك في مجال العمل بموقع وإصدارات الكلية

  - name: "تاسعاً: مناخ الابتكار والتطوير"
    recommendation: تهيئة بيئة محفزة على الابتكار من خلال مسابقات داخلية لأفضل المقترحات التطويرية، وتبني الأفكار الواعدة وتطبيقها بدعم مادي ومعنوي.
    questions:
      - تشجع الكلية أعضاء هيئة التدريس على الابتكار والتطوير

  - name: "عاشراً: الدورات التدريبية لتنمية القدرات"
    recommendation: بناء خطة تدريبية مبنية على قياس الاحتياجات الفعلية لأعضاء هيئة التدريس، وتنويع البرامج بين التعليمية والمهنية والتكنولوجية بما يلبي متطلبات تطوير الأداء.
    questions:
      - تنظم وحدة الجودة برامج تدريبية لتنمية قدراتك في المجالات المختلفة
      - يتم تنظيم البرامج التدريبية وفقاً لاحتياجاتك الفعلية

  - name: "الحادي عشر: معايير تقويم الأداء"
    recommendation: تطوير معايير تقويم موضوعية ومعلنة لأداء أعضاء هيئة التدريس، وتطبيق مبدأ الثواب والعقاب وربط الحوافز بنتائج التقويم بشكل عادل وشفاف.
    questions:
      - تتسم معايير تقويم أدائك بالموضوعية والعدالة
      - يتم تطبيق مبدأ الثواب والعقاب وربط الحوافز بالأداء

  - name: "الثاني عشر: فاعلية وحدة ضمان الجودة والاعتماد"
    recommendation: تكثيف برامج التعريف بالرؤية والرسالة والأهداف الاستراتيجية، وتفعيل مشاركة أعضاء هيئة التدريس في أنشطة الوحدة، والإعلان السنوي عن نتائج الاستبيانات وإجراءات الاستفادة منها.
    questions:
      - يتم تعريفك بالرؤية والرسالة والأهداف الاستراتيجية
      - تشارك في أنشطة وحدة ضمان الجودة
      - يتم سنوياً قياس آرائكم ومناقشة النتائج والاستفادة منها

  - name: "الثالث عشر: المتطلبات الوظيفية"
    recommendation: تحديث التوصيف الوظيفي لأعضاء هيئة التدريس بصورة موثقة، وعقد جلسات تعريفية بالمهام والمسؤوليات لتسهيل المتابعة والتقييم والتوجيه.
    questions:
      - يوجد توصيف وظيفي به تحديد للسلطات ومسؤوليات الوظيفة
      - يتم تعريفي بالمهام الوظيفية لإمكانية المتابعة والتقييم والتوجيه

  - name: "الرابع عشر: المكتبة"
    recommendation: رفع كفاءة المكتبة من حيث التجهيزات والخدمات، وتحديث المراجع والدوريات بصفة دورية بما يخدم احتياجات البحث العلمي والتدريس.
    questions:
      - تتوفر مكتبة تتضمن جميع التجهيزات والخدمات
      - توجد بالمكتبة مراجع ودوريات متنوعة وحديثة

  - name: "الخامس عشر: ظروف العمل"
    recommendation: تحسين بيئة العمل لأعضاء هيئة التدريس من حيث الإضاءة والتهوية والتجهيزات المكتبية بما يتلاءم مع طبيعة المهام الأكاديمية والإدارية.
    questions:
      - ملائمة بيئة العمل من حيث الإضاءة والتهوية والتجهيزات

  - name: "السادس عشر: الدعم غير المادي"
    recommendation: تفعيل برامج التحفيز المعنوي للمتميزين في التدريس من أعضاء هيئة التدريس، ومنح شهادات تقدير وخطابات شكر دورية تعكس تقدير الإدارة لمجهوداتهم.
    questions:
      - تحفز إدارة الكلية معنوياً المتميزين في مجالات التدريس
      - يتم تكريم المتميزين ومنحهم شهادات تقدير لمجهودهم في العمل

  - name: "السابع عشر: قواعد تعيين هيئة التدريس"
    recommendation: اعتماد ضوابط معلنة لتعيين أعضاء هيئة التدريس تشمل الإعلان عن الوظائف الشاغرة والمقابلات الشخصية وفق معايير الجدارة والشفافية.
    questions:
      - تتبع معايير عادلة ومعلنة عند تعيين أعضاء هيئة التدريس
      - توجد آلية لتعيين أعضاء هيئة التدريس (الإعلان عن الوظيفة / مقابلة)
