reportSections:
  afterEvaluators:
    title: "أولاً: إجراءات قياس آراء الأطراف المجتمعية وجهات التوظيف"
    intro: "يتم قياس آراء الأطراف المجتمعية وجهات التوظيف وفق الإجراءات التالية:-"
    items:
      - "يتم إعداد استبيان قياس الرضا استرشاداً بنموذج الهيئة الموجود بدليل التقويم والاعتماد للبرنامج التعليمي."
      - "توزع الاستبيانات سنوياً إلكترونياً عقب نهاية كل عام دراسي."
      - "يتم تحليل الاستبيانات ومناقشة النتائج بمجلس الكلية."
      - "يستفاد من نتائج تحليل الاستبيانات وتتخذ الإجراءات التصحيحية اللازمة."

questions:
  - يتميز خريجو البرنامج بقدرتهم على أداء المهام التي يكلفون بها بقدرة عالية
  - تتوافر لدى خريجي البرنامج المعارف والمهارات المهنية الحديثة
  - يتصف خريجو البرنامج بالانضباط الشديد والتقيد بأوقات العمل
  - يتميز خريجو البرنامج بقدرتهم على العمل تحت الضغوط وإنجاز مهام متعددة
  - لدى خريجي البرنامج مهارات التواصل والتفاعل مع فرق العمل داخل المؤسسة
  - يمتلك خريجو البرنامج قدرة عالية على التفكير الناقد وحل المشكلات وإبداء الرأي في اتخاذ القرارات داخل المؤسسة
  - يمتلك خريجو البرنامج الرغبة في تطوير أنفسهم والقدرة على التعلم الذاتي لمواكبة كل ما هو جديد في مجال تخصصهم
  - يحقق خريجو البرنامج الرضا عند تقييم الأداء في الشركات والمؤسسات التي يعملون بها
