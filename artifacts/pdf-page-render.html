<!doctype html>
<html><meta charset="utf-8"><style>body{margin:0;background:#333;display:grid;place-items:start center}canvas{background:#fff;max-width:100%;height:auto}</style>
<canvas id="page"></canvas>
<script type="module">
  import * as pdfjsLib from "pdfjs-dist";
  import workerSrc from "pdfjs-dist/build/pdf.worker.min.mjs?url";
  pdfjsLib.GlobalWorkerOptions.workerSrc = workerSrc;
  const bytes = new Uint8Array(await (await fetch("/artifacts/pdf-layout-output.pdf")).arrayBuffer());
  const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
  const requested = Number(new URLSearchParams(location.search).get("page") || 1);
  const page = await pdf.getPage(Math.min(Math.max(requested, 1), pdf.numPages));
  const viewport = page.getViewport({ scale: 1.45 });
  const canvas = document.querySelector("#page");
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
  document.title = `rendered-${requested}-of-${pdf.numPages}`;
</script>
</html>
