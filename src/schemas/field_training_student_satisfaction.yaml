reportTexts:
  reportTitle: "استبيان رضا الطلاب عن التدريب الميداني"
  reportSubtitle: "تقرير نتائج تحليل الاستبيان"
  introduction: "في إطار تحسين جودة التدريب الميداني ورفع كفاءة المخرجات التعليمية، تم تنفيذ استبيان لقياس آراء الطلاب حول تجربتهم في التدريب الميداني. شمل الاستبيان مجموعة من العبارات التي تقيس جوانب مختلفة من التخطيط والتنفيذ والإشراف والتأثير الأكاديمي والمهني للتدريب."
  variablesText: "اشتمل استبيان رضا الطلاب عن التدريب الميداني على (11) عبارة تقيس التخطيط والتنفيذ والإشراف والأثر الأكاديمي والمهني للتدريب."
  methodologyText: "تم تحليل الاستجابات باستخدام المقياس الخماسي: لا أوافق بشدة، لا أوافق، محايد، أوافق، أوافق بشدة، مع حساب المتوسط الحسابي ونسبة الموافقة لكل عبارة وللاستبيان ككل."
  summaryHeading: "ثانياً: نتائج تحليل قياس آراء الطلاب عن التدريب الميداني"
  resultsHeading: "ثالثاً: التحليل التفصيلي لعبارات الاستبيان"
  recommendationsHeading: "أخيراً: التوصيات"
  noRecommendationsText: "لا توجد توصيات؛ إذ حققت جميع عبارات الاستبيان مستوى الرضا المستهدف."
  recommendationTemplate: "مراجعة العبارة المرتبطة بمحور {اسم_المحور} ووضع إجراء تصحيحي مناسب؛ إذ بلغت نسبة الموافقة {النسبة}%."

reportSections:
  skipStandardSections: true
  afterEvaluators:
    title: "أولاً: إجراءات قياس رضا الطلاب عن التدريب الميداني"
    intro: "يتم قياس رضا الطلاب عن التدريب الميداني وفق الإجراءات التالية:-"
    items:
      - "يتم إعداد استبيان قياس الرضا استرشاداً بنموذج الهيئة الموجود بدليل التقويم والاعتماد للبرنامج التعليمي."
      - "توزع الاستبيانات سنوياً إلكترونياً عقب نهاية كل عام دراسي."
      - "يتم تحليل الاستبيانات ومناقشة النتائج بمجلس الكلية."
      - "يستفاد من نتائج تحليل الاستبيانات وتتخذ الإجراءات التصحيحية اللازمة لزيادة رضا الطلاب عن التدريب الميداني."

recommendation: "مراجعة نتائج استبيان التدريب الميداني، وتعزيز التنسيق مع جهات التدريب والإشراف الأكاديمي والميداني، واتخاذ الإجراءات التصحيحية اللازمة لرفع رضا الطلاب وتحسين الأثر الأكاديمي والمهني للتدريب."

questions:
