id: student
name: رضا الطلاب
nameEn: Student Satisfaction
icon: "🎓"
scale: 5
hints: [رضا الطلاب, student, ACC, طلاب]

meta:
  level: [المستوى]
  freetext: [مقترحات, "اية مقترحات"]

axes:
  - name: "أولاً: سياسات القبول والتحويل والتوزيع"
    questions:
      - توجد معلومات كافية عن شروط وإجراءات القبول والتسجيل (دليل الطالب/الموقع الإلكتروني).
      - تتم إجراءات القبول والتسجيل ودفع المصاريف بدقة في الوقت المناسب.

  - name: "ثانياً: الالتزام بمحتوى ومواعيد المحاضرات"
    questions:
      - يلتزم المحاضر بتوقيت وزمن المحاضرة والتطبيقات العملية.

  - name: "ثالثاً: طرق التدريس وتكنولوجيا التعليم"
    questions:
      - يستخدم المحاضر الوسائل التعليمية المناسبة مثل الداتا شو والسبورة.
      - طرق التدريس متنوعة وتكسبني المعلومات اللازمة.

  - name: "رابعاً: أسلوب معاملة أعضاء هيئة التدريس ومعاونيهم"
    questions:
      - يتم التعامل باحترام مع الطلاب وتوجيههم التوجيه المناسب.

  - name: "خامساً: البيئة التعليمية للبرنامج"
    questions:
      - البيئة التعليمية ملائمة من حيث التجهيزات وتوافر وسائل تعليمية.
      - تناسب الإضاءة والتهوية والنظافة.

  - name: "سادساً: التدريب الميداني"
    questions:
      - تتنوع الجهات التي يتم تدريب الطلاب بها.
      - تشرف الكلية وجهات التدريب على التدريب الميداني.
      - يتم قياس رأي الطلاب في فاعلية التدريب الميداني.
      - يساعد التدريب الميداني بفاعلية في اكتساب المهارات المهنية والعامة.
      - يقوم المشرفون بتقييم التدريب الميداني من خلال تقارير متابعة.

  - name: "سابعاً: المختبرات والمعامل وقاعات التدريس"
    questions:
      - تتناسب تجهيزات المعامل والقاعات مع احتياجات التدريب العملي.
      - تتوفر بالقاعات الدراسية خدمات الإنترنت والداتا شو.

  - name: "ثامناً: أساليب التعليم والتعلم وفاعلية التعلم الذاتي"
    questions:
      - يتم تشجيع الطلاب على أنشطة التعلم الذاتي.
      - تتوافر المصادر المختلفة للتعلم الذاتي من مكتبة وإنترنت ومراجع.
      - أساليب التعليم والتعلم متنوعة وحديثة.

  - name: "تاسعاً: الإرشاد الأكاديمي / الساعات المكتبية"
    questions:
      - تسهم الساعات المكتبية في فهم النقاط الغير واضحة بالمحاضرة أو الدروس العملية.
      - يتوافر مرشد أكاديمي يساعدك في اختيار المقررات ودعمك أكاديمياً.

  - name: "عاشراً: الأعمال الفصلية"
    questions:
      - يكلف المحاضر الطلاب بأعمال فصلية تحقق أهداف المقرر.
      - تتنوع تكليفات أنشطة الأعمال الفصلية.

  - name: "الحادي عشر: الدروس الخصوصية"
    questions:
      - لا توجد ظاهرة الدروس الخصوصية بالكلية.
      - تتعامل الكلية مع مشكلة الدروس الخصوصية وتمنعها.

  - name: "الثاني عشر: الكتاب الجامعي"
    questions:
      - يتوافر الكتاب مع بداية الفصل الدراسي.

  - name: "الثالث عشر: الكثافة العددية"
    questions:
      - أعداد الطلاب بالمحاضرة مناسبة مع قاعات التدريس.
      - تناسب المعامل الدراسية مع أعداد الطلاب بالسكشن.

  - name: "الرابع عشر: الأساليب المستخدمة في تقويم مخرجات التعليم والتعلم"
    questions:
      - تتضمن ورقة الأسئلة الدرجة الكلية وتوزيع الدرجات على الأسئلة.
      - تتنوع الأسئلة بالورقة الامتحانية (اختيار من متعدد، صح وخطأ...إلخ).
      - تقيس أسئلة المقرر مخرجات التعلم وتراعي الفروق بين الطالب الجيد والضعيف.
      - جدول الامتحانات مناسب وترتيب المواد يسمح بمراجعة المقررات.

  # ax15: q32 is sequential (col 31), then q33↔q34 are swapped in the Excel
  - name: "الخامس عشر: الأنشطة الطلابية"
    questions:
      - يتوافر بالكلية أنشطة رياضية وثقافية وترفيهية واجتماعية.
      - text: تتوافر الأماكن المناسبة لممارسة الأنشطة الطلابية.
        col: 33
      - text: يوجد تشجيع وتحفيز للمتفوقين في الأنشطة الطلابية.
        col: 32

  # ax16: Excel has a gap at col 34 — q35 starts at col 35
  - name: "السادس عشر: المنح الدراسية"
    questions:
      - text: يقدم الكلية منحاً مادية للمتفوقين أكاديمياً ورياضياً.
        col: 35

  - name: "السابع عشر: تشجيع التفوق والتميز"
    questions:
      - يتم تشجيع وتحفيز المتميزين مادياً ومعنوياً في الأنشطة المختلفة.

  - name: "الثامن عشر: إتاحة المعلومات"
    questions:
      - تتوافر بالموقع الإلكتروني معلومات كافية عن الكلية.
      - يوجد دليل للطلاب يتضمن معلومات كافية.

  - name: "التاسع عشر: سياسات عدم التمييز والعدالة"
    questions:
      - يوجد نظام التظلم من نتائج الامتحانات.

  # ax20: Excel has a gap at col 40 — q40 starts at col 41
  - name: "العشرون: التسهيلات المتاحة بالمكتبة"
    questions:
      - text: تتوافر بالمكتبة لوحات إرشادية ونشرات تعريفية بالإجراءات المتبعة.
        col: 41
      - ساعات العمل بالمكتبة مناسبة لوقتك وجدولك.

  - name: "الحادي والعشرون: فاعلية المشاركة في اللجان والأنشطة"
    questions:
      - يشارك الطلاب بفاعلية في اللجان المعنية بالطلاب.
      - أطرح مقترحاتي وتوضع في الاعتبار وتتم دراستها والاستفادة منها.

  - name: "الثاني والعشرون: مصداقية إدارة البرنامج"
    questions:
      - تتسم القيادة الأكاديمية بالمصداقية في أي قرارات تتعلق بالطلاب.

  - name: "الثالث والعشرون: الشكاوى والمقترحات"
    questions:
      - توجد آلية معلنة لتلقي ومتابعة شكاوى الطلاب ومقترحاتهم.
      - يتم إخطار الطلاب بنتيجة شكواهم.

  - name: "الرابع والعشرون: الخدمات المقدمة للمتعثرين دراسياً"
    questions:
      - يوجد دعم وتوجيه للطلاب الراسبين وفق ظروفهم واحتياجاتهم.

  - name: "الخامس والعشرون: الخدمات المقدمة لذوي الاحتياجات الخاصة"
    questions:
      - تتوافر دورات مياه خاصة بذوي الاحتياجات الخاصة.
      - تتوافر إنشاءات ومنحدرات خاصة بذوي الاحتياجات الخاصة.
