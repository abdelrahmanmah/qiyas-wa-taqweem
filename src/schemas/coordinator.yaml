id: coordinator
name: تقييم أداء منسقي البرامج
nameEn: Program Coordinator Performance
icon: "🏛️"
scale: 5
hints: [منسقي, منسق, coordinator, تقييم الأداء]
desc: "محوران – 23 عبارة – مقياس 5 درجات"

meta:
  degree: [الوظيفة, وظيفة]
  dept: [التخصص, تخصص]

axes:
  - name: "المحور الأول: السمات الشخصية"
    questions:
      - يدعم العلاقات الإنسانية وقنوات الاتصال بين الأطراف المختلفة
      - يتيح فرص الحوار والمناقشة وقبول الاختلاف في الرأي
      - يشجع على المشاركة في صنع القرار
      - يشجع على حب العمل والانتماء والإبداع
      - يجيد الاستماع ويتحقق من صحة ما يصل إليه من معلومات
      - يحقق العدل والمساواة في توزيع أعباء العمل
      - يراعي الظروف الخاصة عند توزيع المسئوليات
      - يظهر مرونة في التعامل معه
      - يتميز بالالتزام بوعوده تجاه الأطراف المعنية
      - يوفر بيئة مناسبة تساعد في رفع الروح المعنوية
      - يعطي العمل الكثير من وقته

  - name: "المحور الثاني: السمات القيادية"
    questions:
      - يعمل على تحقيق رؤية ورسالة الكلية
      - يتمتع بالخبرة والكفاءة في العمل الإداري
      - يضع خططاً لتطوير العمل ويتابع تنفيذها
      - يضع استراتيجيات وخطط بديلة لمواجهة المشكلات غير المتوقعة
      - يعمل على تحديث وتطوير البرامج التعليمية واستراتيجيات التدريس والتقويم بشكل مستمر
      - لديه القدرة على اتخاذ القرار وتحمل المسئولية
      - يشارك الآخرين في تطوير البرامج ووضع السياسات واتخاذ القرارات وحل المشكلات
      - يسعى القيادات الأكاديمية إلى تطبيق التعليمات واللوائح والقرارات
      - يعقد اجتماعات دورية مع الأطراف المعنية فردية أو جماعية للتعرف على المشاكل وحلها
      - لديه القدرة على إدارة الاجتماعات
      - يتخذ الإجراءات التصحيحية وفقاً للتغذية الراجعة من الأطراف المختلفة
      - يحرص على توفير المعلومات والإمكانات المطلوبة لإنجاز العمل
